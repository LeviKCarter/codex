name: Publish Quick Mute updates

on:
  push:
    branches: [main]
    paths:
      - userscripts/Reddit-Quick-Mute-Mobile.user.js
      - .github/workflows/quick-mute-update.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-mute-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and release changed script
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile
          import urllib.request
          from pathlib import Path

          script_path = 'userscripts/Reddit-Quick-Mute-Mobile.user.js'
          endpoint = f'https://api.github.com/repos/{os.environ["GH_REPOSITORY"]}/contents/{script_path}'
          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          with urllib.request.urlopen(urllib.request.Request(endpoint + '?ref=main', headers=headers), timeout=30) as response:
              record = json.load(response)
          source = base64.b64decode(record['content']).decode('utf-8')
          version_pattern = r'(?m)^(// @version\s+)(\d+)\.(\d+)\.(\d+)\s*$'
          version = re.search(version_pattern, source)
          if not version:
              raise SystemExit('Script must have a numeric major.minor.patch version')
          if '// @namespace    levi.hbr.quick-mute.mobile' not in source:
              raise SystemExit('Script namespace changed; refusing to publish a different script')
          expected_url = 'https://raw.githubusercontent.com/LeviKCarter/codex/main/' + script_path
          for name in ['updateURL', 'downloadURL']:
              value = re.search(rf'(?m)^// @{name}\s+(\S+)$', source)
              if not value or value[1] != expected_url:
                  raise SystemExit(f'{name} must point to the permanent script URL')

          hash_pattern = r'(?m)^// @releaseHash\s+([a-f0-9]{64})\n?'
          old_hash = re.search(hash_pattern, source)
          fingerprint_source = re.sub(r'(?m)^// @version[^\n]*\n?', '', source)
          fingerprint_source = re.sub(hash_pattern, '', fingerprint_source)
          fingerprint = hashlib.sha256(fingerprint_source.encode()).hexdigest()
          if old_hash and old_hash[1] == fingerprint:
              print('Published content is unchanged; no version bump needed')
              raise SystemExit(0)

          next_version = f'{version[2]}.{version[3]}.{int(version[4]) + 1}'
          updated = re.sub(version_pattern, lambda match: match[1] + next_version, source, count=1)
          updated = re.sub(hash_pattern, '', updated)
          updated = updated.replace('// ==/UserScript==', f'// @releaseHash  {fingerprint}\n// ==/UserScript==', 1)

          with tempfile.TemporaryDirectory() as directory:
              candidate = Path(directory) / 'script.js'
              candidate.write_text(updated)
              subprocess.run(['node', '--check', str(candidate)], check=True)

          payload = {
              'message': f'Release Reddit Quick Mute {next_version}',
              'branch': 'main',
              'sha': record['sha'],
              'content': base64.b64encode(updated.encode()).decode(),
          }
          request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          print(f'Published version {next_version} ({result["commit"]["sha"][:12]})')
          PY
